---
site_name: Descant
site_description: A GDPR-compliant comment management system
site_author: Keith Gaughan
theme:
  name: material
  palette:
    primary: teal
    accent: orange
  features:
    - navigation.tabs

repo_url: https://github.com/kgaughan/descant/
edit_uri: blob/main/docs/

markdown_extensions:
  pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
  pymdownx.inlinehilite: {}
  pymdownx.snippets: {}
  pymdownx.superfences: {}
  admonition: {}
  attr_list: {}
  abbr: {}

nav:
  - Home: index.md
  - design.md
  - development.md
  - todo.md
